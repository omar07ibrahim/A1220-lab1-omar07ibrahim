[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-receipt-extractor"
version = "0.4.0"
description = "A bounded, privacy-explicit multimodal receipt extraction pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Omar Ibrahim", email = "31526072+omar07ibrahim@users.noreply.github.com" },
]
keywords = ["document-intelligence", "multimodal", "receipts", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai==2.48.0",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
]

[project.scripts]
receipt-extractor = "receipt_extractor.main:main"
receipt-evaluator = "receipt_extractor.evaluation_cli:main"

[project.urls]
Repository = "https://github.com/omar07ibrahim/A1220-lab1-omar07ibrahim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--basetemp=.pytest-tmp",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["receipt_extractor"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise AssertionError",
]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PYI"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
