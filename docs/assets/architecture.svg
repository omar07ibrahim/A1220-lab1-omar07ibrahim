t><text x="885" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">audit metadata</text><rect x="790" y="304" width="190" height="112" rx="22" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="885" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Exact replay</text><text x="885" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">replay.py</text><rect x="790" y="526" width="190" height="112" rx="22" fill="#121a2e" stroke="#ff7b8b" stroke-width="3"/><text x="885" y="576" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Live Responses</text><text x="885" y="608" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">gpt.py</text><rect x="1040" y="304" width="190" height="112" rx="22" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="1135" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Typed boundary</text><text x="1135" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">ReceiptFields</text><rect x="1270" y="304" width="145" height="112" rx="22" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="1342" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Result sink</text><text x="1342" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">0600 / stdout</text><rect x="270" y="690" width="205" height="104" rx="22" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="372" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Replay manifest</text><text x="372" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">strict JSON + digest</text><rect x="790" y="690" width="190" height="104" rx="22" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="885" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Run builder</text><text x="885" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">provenance.py</text><rect x="1040" y="690" width="190" height="104" rx="22" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="1135" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Run verifier</text><text x="1135" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">four bindings</text><rect x="1270" y="690" width="145" height="104" rx="22" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="1342" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Fixed stdout</text><text x="1342" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">verified: true</text><text x="720" y="842" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffc857">Offline replay provenance: synthetic evidence, no key, no provider request</text></svg>