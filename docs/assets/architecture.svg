<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description"><title id="title">Auditable Receipt Extractor architecture</title><desc id="description">The real CLI flow from bounded receipt inputs through preflight and three execution modes, plus content-addressed replay run creation and local four-binding verification.</desc><rect width="1440" height="880" fill="#0b1020"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8c7"/></marker></defs><text x="52" y="66" text-anchor="start" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#edf2ff">One preflight, three modes, one local provenance verifier</text><text x="54" y="105" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#9aa8c7">Replay can emit a normal result or one content-addressed run bundle; verification never imports OpenAI.</text><path d="M 222 360 L 270 360" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 475 360 L 535 360" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 725 342 L 790 138" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 725 360 L 790 360" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 725 378 L 790 582" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 475 742 C 610 742 640 430 790 390" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 980 360 L 1040 360" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 980 582 C 1020 582 1010 402 1040 402" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 1230 360 L 1270 360" stroke="#9aa8c7" stroke-width="3" fill="none" marker-en