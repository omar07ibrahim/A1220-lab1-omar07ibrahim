<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title description"><title id="title">Auditable Receipt Extractor architecture</title><desc id="description">The real CLI flow from bounded receipt inputs through preflight, dry-run, exact replay or live Responses, typed validation, and an explicit private sink.</desc><rect width="1440" height="800" fill="#0b1020"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8c7"/></marker></defs><text x="52" y="66" text-anchor="start" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#edf2ff">One preflight, three explicit execution modes</text><text x="54" y="105" text-anchor="start" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#9aa8c7">Replay and live share one typed boundary; dry-run emits audit metadata.</text><path d="M 265 359 L 330 359" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 570 350 L 665 150" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 570 359 L 665 359" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 570 368 L 665 584" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 570 654 L 665 398" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 895 150 C 1050 150 1120 240 1260 330" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 895 359 L 985 359" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 895 584 C 940 584 940 398 985 398" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 1205 359 L 1260 359" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="300" width="210" height="118" rx="22" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="160" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Receipt batch</text><text x="160" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">PNG / JPEG / WebP</text><rect x="330" y="300" width="240" height="118" rx="22" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="450" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Pinned preflight</text><text x="450" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">file_io.py</text><rect x="665" y="96" width="230" height="108" rx="22" fill="#121a2e" stroke="#a78bfa" stroke-width="3"/><text x="780" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Dry-run</text><text x="780" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">audit metadata</text><rect x="665" y="300" width="230" height="118" rx="22" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="780" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Exact replay</text><text x="780" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">replay.py</text><rect x="665" y="530" width="230" height="118" rx="22" fill="#121a2e" stroke="#ff7b8b" stroke-width="3"/><text x="780" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Live Responses</text><text x="780" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">gpt.py</text><rect x="985" y="300" width="220" height="118" rx="22" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="1095" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Typed boundary</text><text x="1095" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">ReceiptFields</text><rect x="1260" y="300" width="150" height="118" rx="22" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="1335" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Private sink</text><text x="1335" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">0600 / stdout</text><rect x="330" y="600" width="240" height="108" rx="22" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="450" y="650" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#edf2ff">Replay manifest</text><text x="450" y="682" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">strict JSON + digest</text><text x="780" y="742" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffc857">Offline: no key, no OpenAI import</text><text x="780" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ff7b8b">Live: explicit upload acknowledgement + explicit sink</text></svg>