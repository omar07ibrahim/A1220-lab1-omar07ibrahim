<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description"><title id="title">Synthetic evaluation identity bindings</title><desc id="description">Exact image descriptors bind into a content-addressed suite. Pinned evaluator semantics and the full suite are recomputed into one aggregate report, which the offline verifier compares completely.</desc><rect width="1440" height="760" fill="#0b1020"/><defs><marker id="evaluation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8c7"/></marker></defs><text x="52" y="62" text-anchor="start" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#edf2ff">From exact fixture bytes to a recomputed aggregate receipt</text><text x="54" y="101" text-anchor="start" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#9aa8c7">Domain-separated SHA-256 identities are mismatch guards, not signatures or timestamps.</text><path d="M 670 251 L 770 251" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#evaluation-arrow)"/><path d="M 1080 314 L 1080 414" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#evaluation-arrow)"/><path d="M 670 477 L 770 477" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#evaluation-arrow)"/><rect x="50" y="188" width="620" height="126" rx="22" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="74" y="226" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#57d3ff">Production-loaded inputs</text><text x="74" y="258" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">8 PNG descriptors</text><text x="74" y="290" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">sha256:ec44e53db23c7b7731bfb9dab522eb0b26ba9518eb9a59484363d65f8be2f728</text><rect x="770" y="188" width="620" height="126" rx="22" fill="#121a2e" stroke="#a78bfa" stroke-width="3"/><text x="794" y="226" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#a78bfa">Content-addressed suite</text><text x="794" y="258" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">balanced-authored-negative-control-v1</text><text x="794" y="290" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">sha256:6327c74a55bf22e260ff599ce22ae99f2f54338bcce99adbb98d0fec9656ac5c</text><rect x="50" y="414" width="620" height="126" rx="22" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="74" y="452" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffc857">Pinned evaluator semantics</text><text x="74" y="484" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">receipt-extractor/exact-field-evaluator</text><text x="74" y="516" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">sha256:0e7fd754958dce9f3e426b8988716296240e15e7cd98588c394d57675f5f55e2</text><rect x="770" y="414" width="620" height="126" rx="22" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="794" y="452" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#63e6a5">Aggregate evaluation receipt</text><text x="794" y="484" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">synthetic-negative-control-calibration</text><text x="794" y="516" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">sha256:291dc7ec589f862f035201a63003778558999545cce965ae1f606bcbff84262c</text><rect x="220" y="622" width="1000" height="78" rx="20" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="720" y="653" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="600" fill="#63e6a5">Offline verifier</text><text x="720" y="682" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">reload suite + reload report + recompute every metric + compare complete canonical report bytes</text><path d="M 1080 540 C 1080 590 980 600 930 622" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#evaluation-arrow)"/><path d="M 1360 314 C 1410 370 1400 590 1140 622" stroke="#9aa8c7" stroke-width="2" stroke-dasharray="8 7" fill="none" marker-end="url(#evaluation-arrow)"/></svg>