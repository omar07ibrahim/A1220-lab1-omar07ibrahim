<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title description"><title id="title">Four content-addressed replay run bindings</title><desc id="description">Four locally recomputed values connect current inputs, the receipt contract, exact manifest bytes, and the complete run body to one verified replay run. Non-hash checks also enforce ordered names, typed outputs, bounded reads, image preflight, and the current schema.</desc><rect width="1440" height="950" fill="#0b1020"/><defs><marker id="binding-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8c7"/></marker></defs><text x="52" y="62" text-anchor="start" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#edf2ff">Four bindings, recomputed by the local verifier</text><text x="54" y="101" text-anchor="start" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#9aa8c7">Every digest below is read from the generated run and provenance source; none is a signature or model claim.</text><rect x="50" y="148" width="330" height="112" rx="20" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="72" y="187" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#57d3ff">Exact input batch</text><text x="72" y="222" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">current preflight descriptors</text><path d="M 380 204 L 445 204" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="445" y="148" width="725" height="112" rx="20" fill="#121a2e" stroke="#57d3ff" stroke-width="3"/><text x="470" y="182" text-anchor="start" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#edf2ff">ordered canonical input descriptors</text><text x="470" y="215" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#57d3ff">sha256:5d45a0fe5c74d98491b6f88de8e3ec48fc5c7b7b00299d6e08e5e2f9b8a181a3</text><text x="470" y="242" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="400" fill="#9aa8c7">run field: body.input_batch_digest</text><path d="M 1170 204 L 1232 204" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="50" y="298" width="330" height="112" rx="20" fill="#121a2e" stroke="#a78bfa" stroke-width="3"/><text x="72" y="337" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#a78bfa">Receipt contract v1</text><text x="72" y="372" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">current receipt contract</text><path d="M 380 354 L 445 354" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="445" y="298" width="725" height="112" rx="20" fill="#121a2e" stroke="#a78bfa" stroke-width="3"/><text x="470" y="332" text-anchor="start" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#edf2ff">domain-separated canonical contract JSON</text><text x="470" y="365" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#a78bfa">sha256:a41dc34788b12c26540266a99c03aa6aecbe70df7250b266676e5fce55f268b2</text><text x="470" y="392" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="400" fill="#9aa8c7">run field: body.contract.digest</text><path d="M 1170 354 L 1232 354" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="50" y="448" width="330" height="112" rx="20" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="72" y="487" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffc857">Raw replay manifest</text><text x="72" y="522" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">exact manifest file bytes</text><path d="M 380 504 L 445 504" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="445" y="448" width="725" height="112" rx="20" fill="#121a2e" stroke="#ffc857" stroke-width="3"/><text x="470" y="482" text-anchor="start" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#edf2ff">SHA-256 of exact manifest file bytes</text><text x="470" y="515" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#ffc857">sha256:f994e398fe79f575daefbd566feb37c4b9dfcbe1db7838bb6218630b072d04d5</text><text x="470" y="542" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="400" fill="#9aa8c7">run field: body.replay_manifest_file_sha256</text><path d="M 1170 504 L 1232 504" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="50" y="598" width="330" height="112" rx="20" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="72" y="637" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#63e6a5">Complete run body</text><text x="72" y="672" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9aa8c7">complete canonical run body</text><path d="M 380 654 L 445 654" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="445" y="598" width="725" height="112" rx="20" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="470" y="632" text-anchor="start" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#edf2ff">domain-separated canonical run body</text><text x="470" y="665" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#63e6a5">sha256:b106034f37c834ee86f3c6086ced2855d46ff402aef16ff7c9235ab8fd4b7a08</text><text x="470" y="692" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="400" fill="#9aa8c7">run field: run_id</text><path d="M 1170 654 L 1232 654" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="50" y="730" width="1120" height="145" rx="22" fill="#121a2e" stroke="#a78bfa" stroke-width="3"/><text x="72" y="764" text-anchor="start" font-family="system-ui, sans-serif" font-size="21" font-weight="600" fill="#a78bfa">Non-hash equality checks</text><rect x="72" y="783" width="300" height="34" rx="12" fill="#19243d" stroke="#9aa8c7" stroke-width="1"/><text x="86" y="806" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">bounded pinned JSON reads</text><rect x="386" y="783" width="260" height="34" rx="12" fill="#19243d" stroke="#9aa8c7" stroke-width="1"/><text x="400" y="806" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">normal image preflight</text><rect x="660" y="783" width="285" height="34" rx="12" fill="#19243d" stroke="#9aa8c7" stroke-width="1"/><text x="674" y="806" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">exact ordered input names</text><rect x="72" y="827" width="300" height="34" rx="12" fill="#19243d" stroke="#9aa8c7" stroke-width="1"/><text x="86" y="850" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">strict typed output equality</text><rect x="386" y="827" width="300" height="34" rx="12" fill="#19243d" stroke="#9aa8c7" stroke-width="1"/><text x="400" y="850" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#edf2ff">current receipt schema</text><path d="M 1170 807 L 1232 807" stroke="#9aa8c7" stroke-width="3" fill="none" marker-end="url(#binding-arrow)"/><rect x="1232" y="148" width="158" height="727" rx="24" fill="#121a2e" stroke="#63e6a5" stroke-width="3"/><text x="1311" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#63e6a5">Local</text><text x="1311" y="488" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#63e6a5">verifier</text><text x="1311" y="544" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#9aa8c7">verified:</text><text x="1311" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="600" fill="#63e6a5">true</text><text x="52" y="918" text-anchor="start" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#9aa8c7">Synthetic replay-only evidence · no provider request · not authenticity</text></svg>